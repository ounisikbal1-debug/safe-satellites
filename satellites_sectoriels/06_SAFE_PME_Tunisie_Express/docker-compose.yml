# ERP Tunisie â€” dÃ©ploiement Docker (serveur + PostgreSQL)
#
#   docker compose up -d
#   â†’ http://localhost:3000
#
# Depuis les autres postes du rÃ©seau local : http://<IP-du-serveur>:3000
#
# Les donnÃ©es PostgreSQL sont conservÃ©es dans le volume Â« pgdata Â».
# Sauvegarde : docker compose exec db pg_dump -U erp erp_tunisie > backup.sql

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_tunisie
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motdepasse_fort}
      # Collation franÃ§aise : les tris de noms (Ã©, Ã¨, Ã ) restent naturels.
      LANG: fr_FR.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_tunisie"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:-motdepasse_fort}@db:5432/erp_tunisie
      DB_DRIVER: tcp
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET:-changez_moi_par_une_chaine_aleatoire_de_64_caracteres}
      AUTH_PROVIDER: local
      NODE_ENV: production
      PORT: 3000
    ports:
      # Â« 0.0.0.0 Â» rend l'ERP accessible depuis le rÃ©seau local.
      - "0.0.0.0:3000:3000"

volumes:
  pgdata:
